server:
  port: 8080

spring:
  application:
    name: cinestats-java

  threads: # Virtual Threads swaps platform threads for lightweight JVM-managed fibers, allowing the application to park concurrent I/O waits with negligible overhead.
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/kinostats # db details we set in docker-compose
    username: cinema
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # forbid Hibernate from mutating schemas
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

